name: "Copilot Code Review"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'flutter_application_1/**'
      - '.github/workflows/**'

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Request Copilot code review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            console.log(`Code review requested for PR #${pr.number}: ${pr.title}`);
            console.log('📋 Copilot will review this PR automatically via GitHub\'s native code review feature');
            console.log('Navigate to the PR to see Copilot\'s review suggestions');
