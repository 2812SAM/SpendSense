name: SpendSense CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  validate:
    name: Flutter Analyze, Test & Pre-commit
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: flutter_application_1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Formatting
        run: dart format . --set-exit-if-changed

      - name: Static Analysis
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test

      - name: Run Pre-commit Hook Script
        run: |
          chmod +x scripts/pre-commit.sh
          # The script runs formatting, analysis, secrets, and tests.
          # We run it as a final validation to ensure the hook logic is fully satisfied.
          ./scripts/pre-commit.sh
