name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-branch
          git diff origin/${{ github.event.pull_request.base.ref }}...pr-branch > /tmp/pr.diff
          cat /tmp/pr.diff

      - name: Review with Gemini
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python3 << 'EOF'
          import os
          import json
          import requests
          import sys

          api_key = os.getenv('GEMINI_API_KEY')
          if not api_key:
              print("❌ GEMINI_API_KEY not set")
              sys.exit(1)

          # Read the PR diff
          with open('/tmp/pr.diff', 'r') as f:
              diff_content = f.read()

          if not diff_content.strip():
              print("No changes in PR")
              sys.exit(0)

          pr_title = os.getenv('PR_TITLE', 'PR')
          pr_body = os.getenv('PR_BODY', 'No description')
          pr_author = os.getenv('PR_AUTHOR', 'Unknown')

          # Prepare Gemini request
          prompt = f"""You are an expert code reviewer. Review this GitHub PR and provide concise, actionable feedback.

**PR Title:** {pr_title}
**PR Author:** {pr_author}
**PR Description:** {pr_body}

**Code Changes:**
```diff
{diff_content[:8000]}  # Limit to 8000 chars for API
```

Please provide:
1. **Summary** - Brief overview of changes (1-2 sentences)
2. **Issues Found** - Any bugs, security concerns, or anti-patterns (if none, say "No critical issues found")
3. **Suggestions** - Best practices or improvements (if any)
4. **Approval Status** - "✅ Approved" or "⚠️ Needs Changes"

Keep the response concise and professional."""

          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent"
          headers = {"Content-Type": "application/json"}
          payload = {
              "contents": [
                  {
                      "parts": [
                          {"text": prompt}
                      ]
                  }
              ]
          }

          try:
              response = requests.post(
                  f"{url}?key={api_key}",
                  json=payload,
                  headers=headers,
                  timeout=30
              )
              response.raise_for_status()
              
              result = response.json()
              review_text = result['candidates'][0]['content']['parts'][0]['text']
              
              # Save review to file
              with open('/tmp/review.txt', 'w') as f:
                  f.write(review_text)
              
              print("✅ Review generated successfully")
              print(review_text)
          except Exception as e:
              print(f"❌ Error calling Gemini API: {e}")
              sys.exit(1)
          EOF

      - name: Post review as PR comment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/review.txt', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 Gemini AI Review\n\n${review}\n\n---\n*Review generated by Gemini AI*`
            });

      - name: Handle API errors
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Gemini Review Failed**: Could not generate review. Please check:\n- API key is valid\n- Rate limits not exceeded\n- PR has code changes'
            });
